version: '3.8'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5080"

  auth-service:
    build:
      context: .
      dockerfile: TechTrack.AuthService/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__AuthServiceDbConnection=Host=postgres;Database=TechTrack_Auth;Username=postgres;Password=admin
      - Jwt__Issuer=http://auth-service
    depends_on:
      - postgres

  user-service:
    build:
      context: .
      dockerfile: TechTrack.UserService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - Jwt__Issuer=http://auth-service
    depends_on:
      - postgres
volumes:
  postgres_data:
