syntax = "proto3";

option csharp_namespace = "TechTrack.Shared.Protos";

package user_id;

service UserIdService {
  rpc GetUserIdByEmail (GetUserIdByEmailRequest) returns (GetUserIdByEmailResponse);
  rpc IsUserExists(IsUserExistsRequest) returns (IsUserExistsResponse);
}

message GetUserIdByEmailRequest {
  string user_email = 1;
}

message GetUserIdByEmailResponse {
  string user_id = 1;
}

message IsUserExistsRequest {
	string user_id = 1;
}

message IsUserExistsResponse{
	bool is_user_exists = 1; 
}